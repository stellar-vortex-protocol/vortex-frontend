name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly extended fuzz run at 03:00 UTC
    - cron: "0 3 * * *"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── nightly extended fuzz ──────────────────────────────
  fuzz:
    name: Fuzz Tests (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Run extended fuzz suite
        env:
          FUZZ_RUNS: "10000"
        run: npx vitest run src/lib/*.fuzz.test.ts
      - name: Upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: src/test/fuzz-corpus/
          retention-days: 30

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Check dependencies for supply-chain security (Issue #311)
        run: node scripts/check-dependencies.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Lint lockfile for integrity issues (Issue #480)
        run: node scripts/lint-lockfile.mjs
      - name: Verify dependency provenance (Issue #480)
        run: node scripts/verify-provenance.mjs
      - name: Generate dependency diff report (Issue #480)
        run: node scripts/dependency-diff-report.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post dependency diff report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('dependency-diff-report.md', 'utf8');
            } catch {
              report = '⚠️ Dependency diff report could not be generated.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
      - run: npm ci
      - run: npm run check:manifest
      - run: npm run check:env
      - run: npm run check:i18n
      - run: npm run check:orphan-tests
      - run: npm run check:docs
      - run: npm run check:dead-code
      - name: Typecheck (strict tsconfig, must be zero errors)
        run: npm run typecheck
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - name: Coverage ratchet (max 0.5 point decrease)
        run: |
          if git show origin/main:coverage/coverage-summary.json > /tmp/base-coverage.json 2>/dev/null; then
            node scripts/coverage-ratchet.mjs /tmp/base-coverage.json coverage/coverage-summary.json
          else
            echo "No base coverage artifact is committed; establishing the baseline."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - run: npx playwright install --with-deps
      - name: Check the e2e suite resolves
        run: npm run test:e2e -- --list
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build & bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      - name: Build with bundle analysis
        run: npm run build
        env:
          ANALYZE: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bundle-analysis-report
          path: .next-analyze/
          retention-days: 30

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PLAYWRIGHT_RETRIES: '2'
      - name: Report flaky tests
        if: always()
        run: |
          if [ -f playwright-report/flaky.json ]; then
            echo '### Flaky tests' >> $GITHUB_STEP_SUMMARY
            cat playwright-report/flaky.json >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  storybook-visual:
    name: Storybook visual tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate CycloneDX SBOM (Issue #480)
        run: node scripts/generate-sbom.mjs sbom.json
      - name: Upload SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Build Storybook
        run: npm run build:storybook
      - name: Run Storybook accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npx --yes http-server storybook-static --port 6006 --silent &
          npx --yes wait-on --timeout 60000 tcp:127.0.0.1:6006
          npm run test:storybook
      - name: Run visual regression tests
        run: npm run test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Build Storybook
        run: npm run build:storybook
      - name: Run Storybook accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npx --yes http-server storybook-static --port 6006 --silent &
          npx --yes wait-on --timeout 60000 tcp:127.0.0.1:6006
          npm run test:storybook
      - name: Run visual regression tests
        run: npm run test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-regression-report
          path: blob-report/
          retention-days: 30

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Check dependencies for supply-chain security (Issue #311)
        run: node scripts/check-dependencies.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Lint lockfile
        run: npm ls --all > /dev/null
      - name: Generate SBOM
        run: npx --yes @cy
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
  security:
    name: Security & supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Check dependencies for supply-chain security (Issue #311)
        run: node scripts/check-dependencies.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Lint lockfile
        run: npm ls --all > /dev/null
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  ci-success:
    name: ci-success
    if: always()
    needs: [static, unit, build, e2e, storybook-visual, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "static=${{ needs.static.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "build=${{ needs.build.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "storybook-visual=${{ needs.storybook-visual.result }}"
          echo "security=${{ needs.security.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo 'One or more required jobs failed.'
            exit 1
          fi
