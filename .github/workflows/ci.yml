name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Check dependencies for supply-chain security (Issue #311)
        run: node scripts/check-dependencies.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Lint lockfile for integrity issues (Issue #480)
        run: node scripts/lint-lockfile.mjs
      - name: Verify dependency provenance (Issue #480)
        run: node scripts/verify-provenance.mjs
      - name: Generate dependency diff report (Issue #480)
        run: node scripts/dependency-diff-report.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post dependency diff report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('dependency-diff-report.md', 'utf8');
            } catch {
              report = '⚠️ Dependency diff report could not be generated.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
      - run: npm ci
      - run: npm run check:env
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      - name: Build with bundle analysis
        run: npm run build
        env:
          ANALYZE: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bundle-analysis-report
          path: .next-analyze/
          retention-days: 30
      - name: Generate CycloneDX SBOM (Issue #480)
        run: node scripts/generate-sbom.mjs sbom.json
      - name: Upload SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
      - name: Build Storybook
        run: npm run build:storybook
      - name: Run visual regression tests
        run: npm run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-regression-report
          path: blob-report/
          retention-days: 30
