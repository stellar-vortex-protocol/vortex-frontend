name: Coverage Badge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  coverage-badge:
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    # Only run on main branch, and only if CI workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Generate coverage badge
        id: coverage
        run: |
          # Parse coverage summary from lcov.info
          if [ -f coverage/lcov.info ]; then
            # Extract line coverage percentage using awk
            COVERAGE=$(awk '/end_of_record/,/end_of_record/ {total+=$3; lines+=$2} END {if(lines > 0) printf "%.0f", (total/lines)*100}' coverage/lcov.info)
            
            if [ -z "$COVERAGE" ]; then
              # Fallback: try to extract from coverage.json if available
              COVERAGE=$(node -e "try { const cov = require('./coverage/coverage-final.json'); let total = 0, lines = 0; Object.values(cov).forEach(f => { total += f.s ? Object.values(f.s).filter(x => x > 0).length : 0; lines += f.s ? Object.keys(f.s).length : 0; }); console.log(Math.round((total/lines)*100)); } catch(e) { console.log('0'); }")
            fi
            
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Create badge SVG
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          
          # Determine color based on coverage percentage
          if [ "$COVERAGE" -ge 80 ]; then
            COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 60 ]; then
            COLOR="yellow"
          elif [ "$COVERAGE" -ge 40 ]; then
            COLOR="orange"
          else
            COLOR="red"
          fi
          
          # Create badge SVG
          cat > coverage-badge.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="112" height="20" role="img" aria-label="coverage: $COVERAGE%">
            <title>coverage: $COVERAGE%</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb"/>
              <stop offset="1" stop-color="#999"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="112" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="61" height="20" fill="#555"/>
              <rect x="61" width="51" height="20" fill="#$COLOR"/>
              <rect width="112" height="20" fill="url(#s)" opacity="0.1"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
              <text aria-hidden="true" x="315" y="150" fill="#010101" fill-opacity="0.3" transform="scale(.1)" textLength="510">coverage</text>
              <text x="315" y="140" transform="scale(.1)" fill="#fff" textLength="510">coverage</text>
              <text aria-hidden="true" x="855" y="150" fill="#010101" fill-opacity="0.3" transform="scale(.1)" textLength="410">$COVERAGE%</text>
              <text x="855" y="140" transform="scale(.1)" fill="#fff" textLength="410">$COVERAGE%</text>
            </g>
          </svg>
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add coverage-badge.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update coverage badge" && git push)
