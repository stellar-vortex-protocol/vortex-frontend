[workspace]
members = [
    "crates/lumenqraph-core",
    "crates/lumenqraph-indexer", 
    "crates/lumenqraph-api",
    "crates/lumenqraph-webhooks",
    "crates/lumenqraph-mcp",
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
serde_json = "1.0"